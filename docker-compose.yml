services:
  dailytimer:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DAILYTIMER_PORT: 8080
      OLLAMA_URL: http://ollama:11434
      VPS_AGENT_URL: http://host.docker.internal:9137
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DAILYTIMER_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    shm_size: 512m
    depends_on:
      - ollama

  # Локальный ИИ без ключей. Наружу не торчит — доступен только DailyTimer.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: 1
